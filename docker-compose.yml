services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
      args:
        - NODE_ENV=development
    ports:
      - '3000:3000/tcp'
      - '9229:9229/tcp'
    volumes:
      - .:/opt:delegated
    environment:
      - MONGO_URI
      - CLIENT_ID
      - CLIENT_SECRET
      - PUBLIC_URL
      - VATSIM_AUTH_URL
      - VACC_AUTH_URL
      - VACC_AUTH_TOKEN
      - VACC_LOGO_URL
      - VACC_IMPRINT_URL
      - JWT_SECRET
      - ALLOW_SIM=true
      - ALLOW_OBS_MASTER=true
  worker:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    ports:
      - '9230:9229/tcp'
    volumes:
      - .:/opt:delegated
    environment:
      - MONGO_URI
      - ROLE=WORKER
  ferretdb:
    image: ghcr.io/ferretdb/ferretdb-eval:latest
    ports:
      - '27017:27017/tcp'
    volumes:
      - ferretdb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=vacdm
      - POSTGRES_PASSWORD=vacdm

volumes:
  ferretdb_data: